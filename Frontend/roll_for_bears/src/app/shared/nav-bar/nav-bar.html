<div class="navbar">

  <div class="navbar-left">
    <a class="logo">
      Roll For <span>Bears</span>
    </a>

    <div class="create-dropdown">
      <button type="button" class="create-button" (click)="changeDropDown()">
        Create

        <span class="dropdown-arrow" [class.open]="isCreateDropDownOpen">
        ⌄
        </span>
      </button>

      @if (isCreateDropDownOpen){
        <div class="create-dropdown-menu">

          <button class="create-dropdown-option" type="button">
            Create Character
          </button>
          <hr>
          <button class="create-dropdown-option" type="button">
            Create System
          </button>
        </div>
      }
    </div>

    <button class="navbar-link" routerLink="/sessions" routerLinkActive="navbar-link-active">Sessions</button>

    <button class="navbar-link" routerLink="/marketplace">Marketplace</button>
  </div>

  <div class="navbar-right">
    <button type="button" class="notification-button" aria-label="Powiadomienia">
      <span class="navbar-icon icon-notification" aria-hidden="true"></span>
    </button>

    <button type="button" class="profile-button" aria-label="Profil">
      <span class="navbar-icon icon-profile" aria-hidden="true"></span>
    </button>

    <button type="button" class="logout-button" aria-label="Wyloguj">
      <span class="navbar-icon icon-logout" aria-hidden="true"></span>
    </button>
  </div>
</div>
